<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NFL Data Visualizer</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #555; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type="text"], input[type="checkbox"], select { margin-right: 5px; margin-bottom: 5px; }
        input[type="text"], select { width: calc(100% - 22px); padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        input[type="checkbox"] { width: auto; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #0056b3; }
        #dataTable { margin-top: 20px; width: 100%; border-collapse: collapse; }
        #dataTable th, #dataTable td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        #dataTable th { background-color: #f0f0f0; }
        #plotDiv { margin-top: 30px; min-height: 400px; } /* Ensure plotDiv has some height */
        .error { color: red; margin-top: 10px; font-weight: bold; }
        .form-group { margin-bottom: 15px; padding: 10px; border: 1px solid #eee; border-radius: 4px;}
        .specific-params h4 { margin-top: 15px; margin-bottom: 5px; color: #333; }
        .specific-params label { font-weight: normal; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>NFL Data Search and Visualization</h1>

        <!-- Data Search Form -->
        <div class="form-group">
            <h2>Search NFL Data</h2>
            <label for="function_name">Select Function:</label>
            <select id="function_name" name="function_name">
                <option value="">-- Select Function --</option>
                <option value="import_pbp_data">Play-by-Play Data (import_pbp_data)</option>
                <option value="import_weekly_data">Weekly Data (import_weekly_data)</option>
                <option value="import_seasonal_data">Seasonal Data (import_seasonal_data)</option>
                <option value="import_seasonal_rosters">Seasonal Rosters (import_seasonal_rosters)</option>
                <option value="import_weekly_rosters">Weekly Rosters (import_weekly_rosters)</option>
                <option value="import_ngs_data">Next Gen Stats (import_ngs_data)</option>
                <option value="import_combine_data">Combine Data (import_combine_data)</option>
                <option value="import_draft_picks">Draft Picks (import_draft_picks)</option>
                <option value="import_qbr">QBR Data (import_qbr)</option>
                <option value="import_seasonal_pfr">Seasonal PFR Stats (import_seasonal_pfr)</option>
                <option value="import_weekly_pfr">Weekly PFR Stats (import_weekly_pfr)</option>
                <option value="import_snap_counts">Snap Counts (import_snap_counts)</option>
                <option value="import_ftn_data">FTN Charting Data (import_ftn_data)</option>
                <option value="import_depth_charts">Depth Charts (import_depth_charts)</option>
                <option value="import_injuries">Injury Reports (import_injuries)</option>
                <option value="import_schedules">Schedules (import_schedules)</option>
                <option value="import_officials">Officials (import_officials)</option>
                <option value="import_win_totals">Win Totals (import_win_totals)</option>
                <option value="import_sc_lines">Scoring Lines (import_sc_lines)</option>
                <option value="import_draft_values">Draft Values (import_draft_values)</option>
                <option value="import_team_desc">Team Descriptions (import_team_desc)</option>
                <option value="import_contracts">Contracts (import_contracts)</option>
                <option value="import_ids">Player IDs (import_ids)</option>
                <option value="import_players">All Players Data (import_players)</option>
            </select>

            <div id="common_params" class="options-group hidden">
                <label for="years" id="years_label">Years (comma-separated):</label>
                <input type="text" id="years" name="years" placeholder="e.g., 2022,2023">

                <label for="columns_search" id="columns_search_label">Columns (comma-separated, optional):</label>
                <input type="text" id="columns_search" name="columns_str" placeholder="e.g., player_name,pass_yards. See nflverse docs for options.">
                <button type="button" id="fetchColumnsBtn" title="Fetches common columns for Play-by-Play or Weekly data types.">Fetch Columns (PBP/Weekly only)</button>
                <div id="availableColumns" style="margin-top:10px;"></div>
            </div>

            <!-- Function-specific parameters -->
            <div id="params_import_pbp_data" class="specific-params options-group hidden">
                <h4>PBP Options:</h4>
                <label title="Include player participation data with PBP."><input type="checkbox" name="pbp_include_participation" checked> Include Participation</label>
                <label title="Convert large float numbers to smaller type to save memory. May slightly reduce precision and slow initial load."><input type="checkbox" name="pbp_downcast" checked> Downcast Floats</label>
                <label title="Use locally cached PBP data if available (see nfl_data_py docs for cache_pbp function)."><input type="checkbox" name="pbp_cache"> Use Cache</label>
                <label for="pbp_alt_path">Alt Cache Path:</label>
                <input type="text" id="pbp_alt_path" name="pbp_alt_path" placeholder="Optional path if using local cache" title="Specify alternative path for PBP cache.">
                <label title="Download data for multiple years concurrently. Faster for good connections."><input type="checkbox" name="pbp_thread_requests"> Thread Requests</label>
            </div>

            <div id="params_import_weekly_data" class="specific-params options-group hidden">
                <h4>Weekly Data Options:</h4>
                <label title="Convert large float numbers to smaller type to save memory. May slightly reduce precision and slow initial load."><input type="checkbox" name="weekly_downcast" checked> Downcast Floats</label>
                <label title="Download data for multiple years concurrently. Faster for good connections."><input type="checkbox" name="weekly_thread_requests"> Thread Requests</label>
            </div>

            <div id="params_import_seasonal_data" class="specific-params options-group hidden">
                <h4>Seasonal Data Options:</h4>
                <label for="seasonal_s_type">Season Type:</label>
                <select id="seasonal_s_type" name="seasonal_s_type">
                    <option value="REG">REG</option>
                    <option value="ALL">ALL</option>
                    <option value="POST">POST</option>
                </select>
            </div>

            <div id="params_import_combine_data" class="specific-params options-group hidden">
                <h4>Combine Data Options:</h4>
                <label for="combine_positions">Positions (comma-separated):</label>
                <input type="text" id="combine_positions" name="combine_positions" placeholder="e.g., WR,QB">
            </div>

            <div id="params_import_ngs_data" class="specific-params options-group hidden">
                <h4>NGS Data Options:</h4>
                <label for="ngs_stat_type">NGS Stat Type:</label>
                <select id="ngs_stat_type" name="ngs_stat_type">
                    <option value="passing">Passing</option>
                    <option value="rushing">Rushing</option>
                    <option value="receiving">Receiving</option>
                </select>
            </div>

            <div id="params_import_qbr" class="specific-params options-group hidden">
                <h4>QBR Data Options:</h4>
                <label for="qbr_level">QBR Level:</label>
                <select id="qbr_level" name="qbr_level">
                    <option value="nfl">NFL</option>
                    <option value="college">College</option>
                </select>
                <label for="qbr_frequency">QBR Frequency:</label>
                <select id="qbr_frequency" name="qbr_frequency">
                    <option value="season">Season</option>
                    <option value="weekly">Weekly</option>
                </select>
            </div>

            <div id="params_import_seasonal_pfr" class="specific-params options-group hidden">
                <h4>Seasonal PFR Options:</h4>
                <label for="pfr_seasonal_s_type">PFR Stat Type:</label>
                <select id="pfr_seasonal_s_type" name="pfr_seasonal_s_type">
                    <option value="pass">Pass</option>
                    <option value="rec">Rec</option>
                    <option value="rush">Rush</option>
                    <option value="def">Def</option>
                </select>
            </div>

            <div id="params_import_weekly_pfr" class="specific-params options-group hidden">
                <h4>Weekly PFR Options:</h4>
                <label for="pfr_weekly_s_type">PFR Stat Type:</label>
                <select id="pfr_weekly_s_type" name="pfr_weekly_s_type">
                    <option value="pass">Pass</option>
                    <option value="rec">Rec</option>
                    <option value="rush">Rush</option>
                    <option value="def">Def</option>
                </select>
            </div>

            <div id="params_import_ftn_data" class="specific-params options-group hidden">
                 <h4>FTN Data Options:</h4>
                 <label title="Convert large float numbers to smaller type to save memory. May slightly reduce precision and slow initial load."><input type="checkbox" name="ftn_downcast" checked> Downcast Floats</label>
                 <label title="Download data for multiple years concurrently. Faster for good connections."><input type="checkbox" name="ftn_thread_requests"> Thread Requests</label>
            </div>

            <div id="params_import_ids" class="specific-params options-group hidden">
                <h4>Player ID Options:</h4>
                <label for="ids_ids">Player IDs to return (subset, comma-separated, optional):</label>
                <input type="text" id="ids_ids" name="ids_ids" placeholder="e.g., 00-0033873,00-0026498">
            </div>

            <button id="searchBtn">Search Data</button>
        </div>
        <div id="searchError" class="error"></div>

        <div id="dataDisplay" class="hidden">
            <h2>Search Results</h2>
            <div id="dataInfo" style="margin-bottom:10px;"></div>
            <div style="max-height: 400px; overflow-y: auto; border: 1px solid #ccc;">
                <table id="dataTable">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- Data Visualization Form -->
        <div id="visualizationForm" class="form-group hidden">
            <h2>Create Visualization</h2>
            <label for="viz_type">Visualization Type:</label>
            <select id="viz_type" name="viz_type">
                <option value="scatter">Scatter Plot</option>
                <option value="line">Line Plot</option>
                <option value="bar">Bar Chart</option>
                <option value="histogram">Histogram</option>
                <option value="box">Box Plot</option>
            </select>

            <label for="x_axis">X-Axis:</label>
            <select id="x_axis" name="x_axis"></select>

            <label for="y_axis">Y-Axis:</label>
            <select id="y_axis" name="y_axis"></select>

            <label for="color_by">Color By (Optional):</label>
            <select id="color_by" name="color_by"><option value="">None</option></select>

            <button id="visualizeBtn">Generate Visualization</button>
        </div>
        <div id="vizError" class="error"></div>
        <div id="plotDiv"></div> <!-- Plotly graph will be rendered here -->
    </div>

    <script>
        let currentData = null; // To store the current search result data (JSON string from df.to_json(orient='split'))
        let currentDataColumns = []; // To store column names from current search

        // Map function names to their parameter div IDs and configuration
        const functionParamMap = {
            'import_pbp_data': { paramsDiv: '#params_import_pbp_data', usesYears: true, yearsRequired: true, usesColumns: true, fetchableColsType: 'pbp' },
            'import_weekly_data': { paramsDiv: '#params_import_weekly_data', usesYears: true, yearsRequired: true, usesColumns: true, fetchableColsType: 'weekly' },
            'import_seasonal_data': { paramsDiv: '#params_import_seasonal_data', usesYears: true, yearsRequired: true, usesColumns: false },
            'import_seasonal_rosters': { paramsDiv: null, usesYears: true, yearsRequired: true, usesColumns: true },
            'import_weekly_rosters': { paramsDiv: null, usesYears: true, yearsRequired: true, usesColumns: true },
            'import_ngs_data': { paramsDiv: '#params_import_ngs_data', usesYears: true, yearsRequired: false, usesColumns: false }, // Years optional in lib
            'import_combine_data': { paramsDiv: '#params_import_combine_data', usesYears: true, yearsRequired: false, usesColumns: false }, // Years optional in lib
            'import_draft_picks': { paramsDiv: null, usesYears: true, yearsRequired: false, usesColumns: false }, // Years optional in lib; GUI makes it required for consistency for now.
            'import_qbr': { paramsDiv: '#params_import_qbr', usesYears: true, yearsRequired: false, usesColumns: false }, // Years optional in lib
            'import_seasonal_pfr': { paramsDiv: '#params_import_seasonal_pfr', usesYears: true, yearsRequired: false, usesColumns: false }, // Years optional
            'import_weekly_pfr': { paramsDiv: '#params_import_weekly_pfr', usesYears: true, yearsRequired: false, usesColumns: false }, // Years optional
            'import_snap_counts': { paramsDiv: null, usesYears: true, yearsRequired: true, usesColumns: false },
            'import_ftn_data': { paramsDiv: '#params_import_ftn_data', usesYears: true, yearsRequired: true, usesColumns: true },
            'import_depth_charts': { paramsDiv: null, usesYears: true, yearsRequired: true, usesColumns: false },
            'import_injuries': { paramsDiv: null, usesYears: true, yearsRequired: true, usesColumns: false },
            'import_schedules': { paramsDiv: null, usesYears: true, yearsRequired: true, usesColumns: false },
            'import_officials': { paramsDiv: null, usesYears: true, yearsRequired: false, usesColumns: false },
            'import_win_totals': { paramsDiv: null, usesYears: true, yearsRequired: false, usesColumns: false },
            'import_sc_lines': { paramsDiv: null, usesYears: true, yearsRequired: false, usesColumns: false },
            'import_draft_values': { paramsDiv: null, usesYears: false, usesColumns: false }, // No years input
            'import_team_desc': { paramsDiv: null, usesYears: false, usesColumns: false }, // No years input
            'import_contracts': { paramsDiv: null, usesYears: false, usesColumns: false }, // No years input
            'import_ids': { paramsDiv: '#params_import_ids', usesYears: false, usesColumns: true }, // No years input
            'import_players': { paramsDiv: null, usesYears: false, usesColumns: false } // No years input
        };

        $('#function_name').change(function() {
            const selectedFunction = $(this).val();
            $('.options-group').addClass('hidden');
            $('#common_params').addClass('hidden'); // Default to hidden, then show if needed
            $('#availableColumns').html('');
            $('#columns_search').val('');
            $('#years').val('');
            $('#searchError').text('');
            $('#dataDisplay').addClass('hidden');
            $('#visualizationForm').addClass('hidden');
            $('#plotDiv').empty();


            if (selectedFunction && functionParamMap[selectedFunction]) {
                const config = functionParamMap[selectedFunction];
                // Only show common_params if either years or columns are used by the function.
                if (config.usesYears || config.usesColumns) {
                    $('#common_params').removeClass('hidden');
                }

                $('#years_label, #years').toggle(!!config.usesYears);
                // Note: HTML 'required' attribute might not be enough for complex forms,
                // rely on JS validation before submit and backend validation.
                // $('#years').prop('required', !!config.yearsRequired);


                $('#columns_search_label, #columns_search').toggle(!!config.usesColumns);
                // Show fetch button only if it's relevant AND columns are generally used
                $('#fetchColumnsBtn').toggle(!!config.fetchableColsType && !!config.usesColumns);
                // Show available columns div only if columns are generally used
                $('#availableColumns').toggle(!!config.usesColumns);


                if (config.paramsDiv) {
                    $(config.paramsDiv).removeClass('hidden');
                }
            }
        });

        $('#fetchColumnsBtn').click(function() {
            const selectedFunction = $('#function_name').val();
            let fetchType = '';
            if (selectedFunction && functionParamMap[selectedFunction] && functionParamMap[selectedFunction].fetchableColsType) {
                fetchType = functionParamMap[selectedFunction].fetchableColsType;
            }

            if (!fetchType) {
                $('#availableColumns').html('<p class="error">Column fetching is specific to PBP/Weekly via this button.</p>');
                return;
            }
            $('#availableColumns').html('<p>Loading columns...</p>');
            $.ajax({
                url: '/get_columns',
                type: 'GET',
                data: { data_type: fetchType },
                success: function(response) {
                    if (response.columns && response.columns.length > 0) {
                        $('#availableColumns').html('<p><strong>Available columns:</strong> ' + response.columns.join(', ') + '</p>');
                    } else if (response.error) {
                        $('#availableColumns').html('<p class="error">' + response.error + '</p>');
                    } else {
                         $('#availableColumns').html('<p>No columns listed or unable to fetch.</p>');
                    }
                },
                error: function(xhr) {
                    $('#availableColumns').html('<p class="error">Error fetching columns: ' + (xhr.responseJSON ? xhr.responseJSON.error : xhr.statusText) + '</p>');
                }
            });
        });

        $('#searchBtn').click(function() {
            $('#searchError').text('');
            $('#dataDisplay').addClass('hidden');
            $('#visualizationForm').addClass('hidden');
            $('#plotDiv').empty();
            $('#dataInfo').text('');
            currentData = null;
            currentDataColumns = [];

            const selectedFunction = $('#function_name').val();
            if (!selectedFunction) {
                $('#searchError').text('Please select a function first.');
                return;
            }

            const config = functionParamMap[selectedFunction];
            let payload = { function_name: selectedFunction };

            if (config.usesYears) {
                const yearsVal = $('#years').val();
                if (config.yearsRequired && (!yearsVal || yearsVal.trim() === '')) {
                    $('#searchError').text('Years are required for this function.');
                    return;
                }
                // Only add years to payload if it has a value, to allow library defaults for optional years
                if (yearsVal && yearsVal.trim() !== '') {
                    payload.years = yearsVal;
                }
            }
            if (config.usesColumns) {
                 const colsVal = $('#columns_search').val();
                 if (colsVal && colsVal.trim() !== '') {
                    payload.columns_str = colsVal;
                 }
            }

            if (config.paramsDiv) {
                $(`${config.paramsDiv} input, ${config.paramsDiv} select`).each(function() {
                    const input = $(this);
                    const name = input.attr('name');
                    if (input.attr('type') === 'checkbox') {
                        payload[name] = input.is(':checked');
                    } else if (input.val() !== null && input.val().trim() !== '') {
                        payload[name] = input.val();
                    }
                });
            }

            console.log("Payload:", payload);

            $.ajax({
                url: '/search',
                type: 'POST',
                data: payload,
                success: function(response) {
                    if (response.error) {
                        $('#searchError').text('Error: ' + response.error);
                        return;
                    }
                    if (response.data) {
                        currentData = response.data;
                        currentDataColumns = response.columns || [];
                        const dfObject = JSON.parse(currentData);

                        const tableHead = $('#dataTable thead');
                        const tableBody = $('#dataTable tbody');
                        tableHead.empty();
                        tableBody.empty();

                        if (dfObject.columns && dfObject.columns.length > 0) {
                             $('#dataInfo').text(`Displaying ${dfObject.data.length} rows and ${dfObject.columns.length} columns.`);
                            let headerRow = '<tr>';
                            dfObject.columns.forEach(col => headerRow += '<th>' + col + '</th>');
                            headerRow += '</tr>';
                            tableHead.append(headerRow);

                            if (dfObject.data.length > 0) {
                                dfObject.data.forEach(rowData => {
                                    let row = '<tr>';
                                    rowData.forEach(cell => row += '<td>' + (cell !== null ? cell : '') + '</td>');
                                    row += '</tr>';
                                    tableBody.append(row);
                                });
                            } else {
                                tableBody.append('<tr><td colspan="' + dfObject.columns.length + '">No data rows returned for these parameters.</td></tr>');
                            }
                            $('#dataDisplay').removeClass('hidden');
                            populateSelectWithOptions('#x_axis', currentDataColumns);
                            populateSelectWithOptions('#y_axis', currentDataColumns);
                            populateSelectWithOptions('#color_by', currentDataColumns, true);
                            $('#visualizationForm').removeClass('hidden');
                        } else { // Handles case where df might have 0 columns (e.g. error or truly empty)
                             $('#searchError').text('Search returned no data or columns.');
                             $('#dataInfo').text('Search returned no data or columns.');
                             $('#dataDisplay').removeClass('hidden'); // Show to display message in dataInfo
                        }
                    }
                },
                error: function(xhr) {
                     const errorMsg = xhr.responseJSON ? xhr.responseJSON.error : xhr.statusText;
                    $('#searchError').text('Search failed: ' + errorMsg);
                }
            });
        });

        $('#visualizeBtn').click(function() {
            $('#vizError').text('');
            // $('#plotDiv').empty(); // Keep previous plot if user wants to compare or if error

            if (!currentData) {
                $('#vizError').text('No data available to visualize. Please perform a search first.');
                return;
            }

            const vizPayload = {
                data_json_str: currentData,
                viz_type: $('#viz_type').val(),
                x_axis: $('#x_axis').val(),
                y_axis: $('#y_axis').val(),
                color_by: $('#color_by').val()
            };

            $.ajax({
                url: '/visualize',
                type: 'POST',
                data: vizPayload,
                success: function(response) {
                    if (response.graph_json) {
                        $('#plotDiv').empty(); // Clear previous plot before rendering new one
                        const graphData = JSON.parse(response.graph_json);
                        Plotly.newPlot('plotDiv', graphData.data, graphData.layout);
                    } else if (response.error) {
                        $('#vizError').text('Visualization Error: ' + response.error);
                    }
                },
                error: function(xhr) {
                     const errorMsg = xhr.responseJSON ? xhr.responseJSON.error : xhr.statusText;
                    $('#vizError').text('Visualization request failed: ' + errorMsg);
                }
            });
        });

        function populateSelectWithOptions(selectId, optionsArray, includeEmptyOption = false) {
            const selectElement = $(selectId);
            selectElement.empty();
            if (includeEmptyOption) {
                selectElement.append($('<option>', { value: '', text: 'None' }));
            }
            if (optionsArray && optionsArray.length > 0) {
                optionsArray.forEach(option => {
                    selectElement.append($('<option>', {
                        value: option,
                        text: option
                    }));
                });
            } else {
                 selectElement.append($('<option>', { value: '', text: 'No columns available' }));
            }
        }

        // Trigger change on page load to set initial visibility of options
        $('#function_name').trigger('change');
    </script>
</body>
</html>
